---
name: Set Up Node Environment
description: Install dependencies for Node.js projects

inputs:
  node_version:
    description: Node version
    required: false
    default: '24'

  machine_user_pat:
    description: Github Catena Machine User Personal Access Token (PAT)
    required: true

runs:
  using: composite
  steps:
    - name: Log in to the GitHub Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.machine_user_pat }}

    - name: Configure git PAT to access our private repositories
      shell: bash
      env:
        MACHINE_USER_PAT: ${{ inputs.machine_user_pat }}
      run: |
        # Keep the PAT out of the URL: newer curl strips credentials from the effective URL,
        # git mistakes that for a redirect and drops them. A credential helper survives it.
        echo "::add-mask::$MACHINE_USER_PAT"
        git config --global credential.https://github.com.helper store
        printf 'protocol=https\nhost=github.com\nusername=x-access-token\npassword=%s\n\n' "$MACHINE_USER_PAT" \
          | git credential approve

    - name: Install Node.js
      id: install-node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version }}

    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v5
      with:
        path: node_modules
        key: node-modules-${{ hashFiles('package-lock.json') }}

    - name: Install Dependencies
      if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        npm install
