---
name: Deploy CDK Stack
description: >-
  Install AWS CDK and the project dependencies, then deploy the CDK stack.
  Before deploying, it checks the target stack's "catena:managed-by" tag and
  fails if the stack already exists but is owned by a different repo, so a new
  service can't overwrite another service's stack that happens to share the same
  name. The deploy then stamps that tag so ownership is always recorded.
  In the development account, deploys of the repos in dev_lock_repos also take
  the global dev lock first (actions/dev-lock, PLAT-473), so two deploys don't
  overwrite each other. Those deploys synthesize the app and publish its assets
  before taking the lock, so a deploy waiting for dev only has to deploy once it
  gets it. Every other deploy is unaffected.

inputs:
  role_to_assume:
    description: Role ARN to be assumed
    required: true

  aws_region:
    description: AWS region to deploy
    required: true

  stack_name:
    description: Name of the stack to deploy
    required: true

  machine_user_pat:
    description: Github Catena Machine User Personal Access Token (PAT)
    required: true

  cdk_version:
    description: AWS CDK version
    required: false
    default: latest

  docker_driver:
    description: Docker driver to use on buildx
    required: false
    default: docker-container

  directory:
    description: Directory to set up the Python environment and deploy the CDK app.
    required: false
    default: .

  exclusively:
    description: Deploy only the specified stack, without its dependencies.
    required: false
    default: "false"

  asset_build_concurrency:
    description: >-
      Maximum number of assets (Docker images) CDK builds in parallel, passed as --asset-build-concurrency.
      It has to be set here rather than in cdk.json: the CDK CLI's command-line default of 1 for this flag
      overrides a cdk.json "assetBuildConcurrency". With the default "1" the flag is not passed at all, so
      deploys are unchanged (one image at a time) and a cdk_version older than 2.1109.0, which does not know
      the flag, keeps working. Any other value must be a positive integer and needs CDK CLI 2.1109.0 or later.
    required: false
    default: "1"

  enforce_ownership_tag:
    description: >-
      When "true", also fail if the target stack already exists but has no
      "catena:managed-by" tag (owner can't be confirmed). Default "false" warns
      and proceeds, then stamps the tag, so legacy stacks deployed before this
      guard existed don't block deploys during rollout.
    required: false
    default: "false"

  dev_lock_repos:
    description: >-
      Comma-separated owner/repo names whose deploys to the development account
      take the global dev lock (PLAT-473). Any other repo, and any deploy to
      another account, never touches the lock. Adding a repo is a change here.
    required: false
    default: "catenaclearing/catena-platform,catenaclearing/telematics-data-service,catenaclearing/telematics-integrations-service,catenaclearing/telematics-intelligence-service,catenaclearing/telematics-notifications-service,catenaclearing/telematics-organizations-service"

  dev_lock_account_id:
    description: >-
      The development AWS account ID. The dev lock is only ever taken when the
      credentials in use belong to this account, so production and management
      deploys cannot touch it.
    required: false
    default: "339713031246"

runs:
  using: composite
  steps:
    - name: Set Up Environment and load Cached Dependencies
      uses: catenaclearing/catena-actions/composite/setup-python@v0
      with:
        machine_user_pat: ${{ inputs.machine_user_pat }}
        directory: ${{ inputs.directory }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver: ${{ inputs.docker_driver }}
        buildkitd-flags: --debug

    - name: Expose GitHub Runtime (for gha cache)
      uses: crazy-max/ghaction-github-runtime@v4

    - name: Cache CDK
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: npm-cdk-${{ runner.os }}-${{ inputs.cdk_version }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role_to_assume }}
        role-session-name: ${{ github.event.repository.name }}-${{ github.actor }}
        aws-region: ${{ inputs.aws_region }}

    # Dev environment lock (PLAT-473). Three steps, built so that nothing here can fail a deploy by accident:
    #   1. the gate decides, and can never fail (script exits 0, and continue-on-error as a second net);
    #   2. the lock step is skipped unless the gate says yes, and runs with continue-on-error, so a bug in the action or
    #      an unreachable lock store lets the deploy go ahead (the lock is coordination, not a security control).
    #      It is a JavaScript action on purpose: GitHub builds or pulls every Docker action in a job during job setup, where
    #      this wiring cannot help, and this composite runs in every deploy, production included;
    #   3. only a deliberate block (dev is locked, mode enforce) stops the deploy, in the step below.
    - name: Decide whether this deploy takes the dev lock
      id: dev-lock-gate
      continue-on-error: true
      shell: bash
      run: '"$ACTION_PATH/dev-lock-gate.sh"'
      env:
        ACTION_PATH: ${{ github.action_path }}
        DEV_LOCK_REPOS: ${{ inputs.dev_lock_repos }}
        DEV_LOCK_ACCOUNT_ID: ${{ inputs.dev_lock_account_id }}

    # The ownership guard once before building too (PLAT-590), so nothing is published for a stack another repo owns.
    # continue-on-error like the build: when it fails, the build is skipped and the guard before "CDK Deploy" (which
    # still runs, and still catches a stack that changed owner while this job waited) stops the deploy as it always did.
    - name: Check stack ownership before building
      id: early-guard
      if: steps.dev-lock-gate.outputs.is_dev_lock == 'true'
      continue-on-error: true
      shell: bash
      run: '"$ACTION_PATH/stack-ownership-guard.sh"'
      env:
        ACTION_PATH: ${{ github.action_path }}
        STACK_NAME: ${{ inputs.stack_name }}
        THIS_REPO: ${{ github.repository }}
        ENFORCE_OWNERSHIP_TAG: ${{ inputs.enforce_ownership_tag }}

    # Build before the lock (PLAT-590): synthesize the app and publish the stack's assets (Docker images, files) while dev
    # may still be busy, so a deploy that waits for the lock has nothing left to build once it gets it. It writes only
    # to the bootstrap bucket and repositories, never to the stack. Only deploys that take the lock do this; every other
    # deploy runs the single `cdk deploy` it always did. continue-on-error, as for the lock: if anything here fails, the
    # assembly is not handed on and "CDK Deploy" synthesizes and builds everything itself, so this step can never turn
    # a deploy that would have worked into a failed one.
    - name: Build and publish the CDK assets before taking the dev lock
      id: prebuild
      if: steps.dev-lock-gate.outputs.is_dev_lock == 'true' && steps.early-guard.outcome == 'success'
      continue-on-error: true
      shell: bash
      run: |
        set -eo pipefail
        cd "$DIRECTORY"
        source .venv/bin/activate
        # `cdk publish-assets` arrived in CDK CLI 2.1116.0. An older pinned cdk_version builds after the lock, as before.
        VERSION="$(npx -y "aws-cdk@$CDK_VERSION" --version | awk '{print $1}')"
        if [ "$(printf '%s\n' 2.1116.0 "$VERSION" | sort -V | head -n 1)" != "2.1116.0" ]; then
          echo "::notice::CDK CLI $VERSION has no publish-assets (2.1116.0 or later); building after taking the dev lock."
          exit 0
        fi
        if ! [[ "$ASSET_BUILD_CONCURRENCY" =~ ^[1-9][0-9]*$ ]]; then
          echo "::warning::asset_build_concurrency must be a positive integer, got '$ASSET_BUILD_CONCURRENCY'."
          exit 1
        fi
        EXCLUSIVELY=()
        if [ "$EXCLUSIVELY_FLAG" = "true" ]; then
          EXCLUSIVELY=(--exclusively)
        fi
        # A fresh directory of its own, named without stack_name: an input like "../../x" must never steer a path here.
        # "CDK Deploy" gets it from this step's output, so a job that deploys several stacks keeps them apart.
        mkdir -p "$RUNNER_TEMP"
        ASSEMBLY="$(mktemp -d "$RUNNER_TEMP/deploy-cdk-assembly.XXXXXX")"
        npx -y "aws-cdk@$VERSION" synth "$STACK_NAME" "${EXCLUSIVELY[@]}" --quiet --output "$ASSEMBLY"
        # Only this stack's assets (and its dependencies' unless exclusively): the app also has stacks for other
        # accounts, which these credentials cannot publish to. --concurrency bounds builds as --asset-build-concurrency does.
        npx -y "aws-cdk@$VERSION" publish-assets "$STACK_NAME" "${EXCLUSIVELY[@]}" --app "$ASSEMBLY" \
          --unstable=publish-assets --concurrency "$ASSET_BUILD_CONCURRENCY"
        # Handed on only once everything above worked.
        echo "assembly=$ASSEMBLY" >> "$GITHUB_OUTPUT"
      env:
        GITHUB_TOKEN: ${{ inputs.machine_user_pat }}
        DOCKER_BUILDKIT: 1
        BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        DIRECTORY: ${{ inputs.directory }}
        CDK_VERSION: ${{ inputs.cdk_version }}
        STACK_NAME: ${{ inputs.stack_name }}
        EXCLUSIVELY_FLAG: ${{ inputs.exclusively }}
        ASSET_BUILD_CONCURRENCY: ${{ inputs.asset_build_concurrency }}

    - name: Take the dev environment lock
      id: dev-lock
      if: steps.dev-lock-gate.outputs.is_dev_lock == 'true'
      continue-on-error: true
      # Pinned to the release that contains this action (v0.16.0), so job setup never waits on the v0 tag moving. Bump it
      # to a later release commit on main when the action changes; never to a branch commit, which can disappear.
      uses: catenaclearing/catena-actions/actions/dev-lock@6aec297a1f3e38103322acbf973c355d8a80bc09
      with:
        aws_region: ${{ inputs.aws_region }}

    - name: Stop the deploy, dev is locked
      id: dev-lock-blocked
      if: steps.dev-lock.outputs.blocked == 'true'
      shell: bash
      run: |
        echo "::error::Not deploying: dev is locked by another deploy or a manual hold."
        echo "::error::The 'Take the dev environment lock' step above says who has it and your queue position."
        exit 1

    - name: Guard against overwriting another service's stack
      shell: bash
      run: '"$ACTION_PATH/stack-ownership-guard.sh"'
      env:
        ACTION_PATH: ${{ github.action_path }}
        STACK_NAME: ${{ inputs.stack_name }}
        THIS_REPO: ${{ github.repository }}
        ENFORCE_OWNERSHIP_TAG: ${{ inputs.enforce_ownership_tag }}

    - name: CDK Deploy
      shell: bash
      run: |
        cd "$DIRECTORY"
        source .venv/bin/activate
        EXCLUSIVELY=""
        if [ "$EXCLUSIVELY_FLAG" = "true" ]; then
          EXCLUSIVELY="--exclusively"
        fi
        # Only pass --asset-build-concurrency when a caller asks for more than CDK's default of 1: CDK CLIs
        # before 2.1109.0 reject the flag, and callers may pin cdk_version to one of them.
        ASSET_BUILD_CONCURRENCY_ARGS=()
        if [ "$ASSET_BUILD_CONCURRENCY" != "1" ]; then
          if ! [[ "$ASSET_BUILD_CONCURRENCY" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::asset_build_concurrency must be a positive integer, got '$ASSET_BUILD_CONCURRENCY'."
            exit 1
          fi
          ASSET_BUILD_CONCURRENCY_ARGS=(--asset-build-concurrency "$ASSET_BUILD_CONCURRENCY")
        fi
        # Deploy the assembly built before the lock when there is one, so the deploy is the code this job built, however
        # long it waited. Its assets are already published, and CDK skips published assets only without --force (with it,
        # `cdk deploy` rebuilds and re-pushes every one), so that path leaves --force out. CDK still deploys whenever the
        # template, tags or parameters differ, so a stack without the catena:managed-by tag still gets it; only a deploy
        # that would change nothing is skipped. Otherwise synthesize and build here, with --force as always.
        APP_ARGS=()
        FORCE_ARGS=(--force)
        if [ -n "$PREBUILT_ASSEMBLY" ]; then
          APP_ARGS=(--app "$PREBUILT_ASSEMBLY")
          FORCE_ARGS=()
        fi
        npx -y "aws-cdk@$CDK_VERSION" deploy "$STACK_NAME" "${APP_ARGS[@]}" \
          "${FORCE_ARGS[@]}" --tags "catena:managed-by=$THIS_REPO" $EXCLUSIVELY "${ASSET_BUILD_CONCURRENCY_ARGS[@]}"
      env:
        GITHUB_TOKEN: ${{ inputs.machine_user_pat }}
        DOCKER_BUILDKIT: 1
        BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        DIRECTORY: ${{ inputs.directory }}
        CDK_VERSION: ${{ inputs.cdk_version }}
        STACK_NAME: ${{ inputs.stack_name }}
        THIS_REPO: ${{ github.repository }}
        EXCLUSIVELY_FLAG: ${{ inputs.exclusively }}
        ASSET_BUILD_CONCURRENCY: ${{ inputs.asset_build_concurrency }}
        PREBUILT_ASSEMBLY: ${{ steps.prebuild.outputs.assembly }}
