---
name: Deploy CDK Stack
description: >-
  Install AWS CDK and the project dependencies, then deploy the CDK stack.
  Before deploying, it checks the target stack's "catena:managed-by" tag and
  fails if the stack already exists but is owned by a different repo, so a new
  service can't overwrite another service's stack that happens to share the same
  name. The deploy then stamps that tag so ownership is always recorded.

inputs:
  role_to_assume:
    description: Role ARN to be assumed
    required: true

  aws_region:
    description: AWS region to deploy
    required: true

  stack_name:
    description: Name of the stack to deploy
    required: true

  machine_user_pat:
    description: Github Catena Machine User Personal Access Token (PAT)
    required: true

  cdk_version:
    description: AWS CDK version
    required: false
    default: latest

  docker_driver:
    description: Docker driver to use on buildx
    required: false
    default: docker-container

  directory:
    description: Directory to set up the Python environment and deploy the CDK app.
    required: false
    default: .

  exclusively:
    description: Deploy only the specified stack, without its dependencies.
    required: false
    default: "false"

  enforce_ownership_tag:
    description: >-
      When "true", also fail if the target stack already exists but has no
      "catena:managed-by" tag (owner can't be confirmed). Default "false" warns
      and proceeds, then stamps the tag, so legacy stacks deployed before this
      guard existed don't block deploys during rollout.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set Up Environment and load Cached Dependencies
      uses: catenaclearing/catena-actions/composite/setup-python@v0
      with:
        machine_user_pat: ${{ inputs.machine_user_pat }}
        directory: ${{ inputs.directory }}

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver: ${{ inputs.docker_driver }}
        buildkitd-flags: --debug

    - name: Expose GitHub Runtime (for gha cache)
      uses: crazy-max/ghaction-github-runtime@v4

    - name: Cache CDK
      uses: actions/cache@v5
      with:
        path: ~/.npm
        key: npm-cdk-${{ runner.os }}-${{ inputs.cdk_version }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role_to_assume }}
        role-session-name: ${{ github.event.repository.name }}-${{ github.actor }}
        aws-region: ${{ inputs.aws_region }}

    - name: Guard against overwriting another service's stack
      shell: bash
      run: |
        set -euo pipefail
        # Ownership is tracked by a stack-level tag that the CDK Deploy step below
        # stamps on every deploy. We read it back here and compare it to this repo.
        # The tag VALUE is the repo, which is unique per service, so this works even
        # though all services are generated from the same template and therefore have
        # near-identical resource names (which is why comparing resources or diffs
        # would not tell two services apart).
        OWNER_TAG="catena:managed-by"
        if ! STACK_JSON=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --output json 2>/dev/null); then
          echo "Stack '$STACK_NAME' does not exist yet. Safe to create."
          exit 0
        fi
        OWNER=$(echo "$STACK_JSON" | jq -r --arg k "$OWNER_TAG" 'first(.Stacks[0].Tags[]? | select(.Key == $k) | .Value) // ""')
        if [ -z "$OWNER" ]; then
          if [ "$ENFORCE_OWNERSHIP_TAG" = "true" ]; then
            MSG="Stack '$STACK_NAME' exists but has no '$OWNER_TAG' tag; owner cannot be confirmed."
            MSG="$MSG enforce_ownership_tag is on. Backfill the tag on the stack, then retry."
            echo "::error::$MSG"
            exit 1
          fi
          MSG="Stack '$STACK_NAME' exists but has no '$OWNER_TAG' tag (legacy stack)."
          MSG="$MSG Cannot confirm owner; proceeding. This deploy will stamp it with '$THIS_REPO'."
          echo "::warning::$MSG"
          exit 0
        fi
        if [ "$OWNER" != "$THIS_REPO" ]; then
          MSG="Stack '$STACK_NAME' already exists and is managed by '$OWNER'."
          MSG="$MSG This deploy is from '$THIS_REPO' - refusing to overwrite another service's stack."
          MSG="$MSG Use a unique stack name in app.py and deploy.yaml."
          echo "::error::$MSG"
          exit 1
        fi
        echo "Stack '$STACK_NAME' is managed by '$OWNER' (this repo). Safe to update."
      env:
        STACK_NAME: ${{ inputs.stack_name }}
        THIS_REPO: ${{ github.repository }}
        ENFORCE_OWNERSHIP_TAG: ${{ inputs.enforce_ownership_tag }}

    - name: CDK Deploy
      shell: bash
      run: |
        cd "$DIRECTORY"
        source .venv/bin/activate
        EXCLUSIVELY=""
        if [ "$EXCLUSIVELY_FLAG" = "true" ]; then
          EXCLUSIVELY="--exclusively"
        fi
        npx -y "aws-cdk@$CDK_VERSION" deploy "$STACK_NAME" \
          --force --tags "catena:managed-by=$THIS_REPO" $EXCLUSIVELY
      env:
        GITHUB_TOKEN: ${{ inputs.machine_user_pat }}
        DOCKER_BUILDKIT: 1
        BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        DIRECTORY: ${{ inputs.directory }}
        CDK_VERSION: ${{ inputs.cdk_version }}
        STACK_NAME: ${{ inputs.stack_name }}
        THIS_REPO: ${{ github.repository }}
        EXCLUSIVELY_FLAG: ${{ inputs.exclusively }}
