---
name: Setup Python and Poetry

on:
  push:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  setup:
    name: Setup Python and Poetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set Up Python Environment
        uses: ./composite/setup-python
        with:
          machine_user_pat: ${{ secrets.MACHINE_USER_PAT }}

      # Run outside the checkout, as poetry/npm clones do: inside it, actions/checkout's
      # GITHUB_TOKEN header is sent instead and can't see other private repos.
      - name: Check access to a private repository
        working-directory: ${{ runner.temp }}
        run: git ls-remote https://github.com/catenaclearing/catena-utils-package.git HEAD
