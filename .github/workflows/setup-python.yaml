---
name: Setup Python and Poetry

on:
  push:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  setup:
    name: Setup Python and Poetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set Up Python Environment
        uses: ./composite/setup-python
        with:
          machine_user_pat: ${{ secrets.MACHINE_USER_PAT }}

      - name: Clone a private repository from the workspace, as poetry/npm do
        run: git clone --depth 1 https://github.com/catenaclearing/catena-utils-package.git "$RUNNER_TEMP/private-repo-check"
