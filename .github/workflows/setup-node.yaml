---
name: Setup Node

on:
  push:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  setup:
    name: Setup Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node environment
        uses: ./composite/setup-node
        with:
          machine_user_pat: ${{ secrets.MACHINE_USER_PAT }}

      - name: Check access to a private repository
        run: git ls-remote https://github.com/catenaclearing/catena-utils-package.git HEAD
