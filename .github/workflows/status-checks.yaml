---
name: Status Checks

on:
  pull_request:
    types:
      - labeled
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.workflow }}-${{ github.actor }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Lint
        uses: catenaclearing/catena-actions/composite/lint-python@main
        with:
          machine_user_pat: ${{ secrets.MACHINE_USER_PAT }}

  test:
    name: Test
    runs-on: ubuntu-latest
    concurrency:
      group: test-${{ github.workflow }}-${{ github.actor }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test
        uses: catenaclearing/catena-actions/composite/test-python@main
        with:
          machine_user_pat: ${{ secrets.MACHINE_USER_PAT }}

  dev-lock:
    name: Test (dev-lock action)
    runs-on: ubuntu-latest
    concurrency:
      group: dev-lock-${{ github.workflow }}-${{ github.actor }}-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: actions/dev-lock
    # dynalite (the default test backend) has no TransactWriteItems, so CI runs the whole suite against DynamoDB Local,
    # where the store's transactions are sent unchanged and really commit or roll back. test/transactions.test.js fails
    # in CI if this endpoint is missing.
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.1.0 # its default command is `-jar DynamoDBLocal.jar -inMemory`
        ports:
          - 8000:8000
    env:
      DEV_LOCK_DYNAMODB_ENDPOINT: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: actions/dev-lock/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for DynamoDB Local
        run: |
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null "$DEV_LOCK_DYNAMODB_ENDPOINT" && exit 0
            sleep 2
          done
          echo "DynamoDB Local did not start" >&2
          exit 1

      # Includes a check that the committed dist/ is what `npm run build` produces: a JavaScript action runs from its bundle.
      - name: Test
        run: npm test

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    concurrency:
      group: checkov-${{ github.workflow }}-${{ github.actor }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Checkov
        uses: catenaclearing/catena-actions/composite/checkov@main
        with:
          machine_user_pat: ${{ secrets.MACHINE_USER_PAT }}

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    concurrency:
      group: semgrep-${{ github.workflow }}-${{ github.actor }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: SAST (Semgrep)
        uses: ./composite/sast-semgrep
