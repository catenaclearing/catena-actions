---
name: Update Mintlify Docs
description: Trigger a documentation update on Mintlify for the specified project and monitor progress.

inputs:
  mintlify_project_id:
    description: Mintlify Project ID
    required: true

  mintlify_token:
    description: Mintlify Assistant API Token
    required: true

  old_openapi_file:
    description: Path to the old/base OpenAPI specification file (JSON or YAML)
    required: true

  new_openapi_file:
    description: Path to the new/changed OpenAPI specification file (JSON or YAML)
    required: true

  max_new_endpoints:
    description: >-
      Refuse the diff, rather than generate a changelog, when it reports more
      new endpoints than this. A whole API surface reading as new means the
      baseline is wrong, not that a release added it (ref FE-600). Raise it for
      a genuine bulk release.
    required: false
    default: "40"

runs:
  using: docker
  image: Dockerfile
