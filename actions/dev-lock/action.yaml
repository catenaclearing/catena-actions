---
name: Dev Lock
description: >-
  Take the global lock on the shared development environment before a deploy, and give it back when the job ends
  (success, failure or cancel). Coordination only: it never fails a deploy because the lock store is unavailable.
  Meant to be called by composite/deploy-cdk, after AWS credentials are configured; see the README.

inputs:
  table_name:
    description: Name of the DynamoDB lock table (created by the DevLock stack in catena-platform)
    required: false
    default: catena-dev-lock

  aws_region:
    description: Region of the lock table. Falls back to AWS_REGION / AWS_DEFAULT_REGION, then us-east-1
    required: false
    default: ""

  ttl_minutes:
    description: How long a deploy's lock lasts if the job dies without releasing it. Refreshed on each call within a job
    required: false
    default: "60"

  wait_minutes:
    description: How long a merge to main waits for a CI deploy ahead of it before giving up
    required: false
    default: "30"

  poll_seconds:
    description: How often a waiting merge to main checks the lock
    required: false
    default: "15"

outputs:
  acquired:
    description: "'true' when this run holds the lock, otherwise 'false' (report-only, off, preempted a manual hold, or fail-open)"

runs:
  using: docker
  image: Dockerfile
  entrypoint: /entrypoint.sh
  post-entrypoint: /post.sh
  post-if: always()
